syntax = "proto3";

package flock.tunnel.v1;

import "google/protobuf/timestamp.proto";
import "flock/types/v1/types.proto";

option go_package = "github.com/teraflock/proto/gen/go/flock/tunnel/v1;tunnelv1";

// TunnelService is the node<->coordinator contract. Nodes dial out and never
// listen (SPEC §3): after Enroll, the daemon opens a single long-lived
// Session stream over mTLS and all work is pushed down it.
service TunnelService {
  // Enroll binds a freshly generated Ed25519 key to an operator account via
  // a claim code and returns the client certificate used for the mTLS
  // Session. Called once on first run and again for cert rotation.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Session is the persistent bidirectional tunnel. The node sends Hello
  // first; the coordinator replies with HelloAck, then pushes dispatches,
  // challenges, model assignments and config down the stream while the node
  // streams heartbeats, token chunks and results up.
  rpc Session(stream NodeMessage) returns (stream CoordinatorMessage);
}

message EnrollRequest {
  // One-time claim code from web signup or `flock login` PKCE flow.
  string claim_code = 1;
  // Node's Ed25519 public key, raw 32 bytes. Node identity = its fingerprint.
  bytes pubkey = 2;
  // PEM-encoded CSR for the mTLS client certificate.
  bytes csr_pem = 3;
  flock.types.v1.CapabilityProfile capability = 4;
  // PKCE code_verifier from the `tera login` browser flow (RFC 7636). The
  // daemon sent base64url(SHA256(verifier)) as code_challenge when it opened
  // the claim page; the coordinator recomputes it and refuses the claim
  // code when it does not match the challenge stored at mint time. Empty
  // for codes minted without a challenge (`--claim-code`, dev meshes),
  // which the coordinator accepts as before.
  string pkce_verifier = 5;
}

message EnrollResponse {
  string node_id = 1;
  bytes client_cert_pem = 2;
  bytes ca_cert_pem = 3;
  // Coordinator's dispatch-signing Ed25519 public key; the node pins this
  // and verifies the signature on every DispatchRequest (SPEC §6).
  bytes coordinator_pubkey = 4;
  google.protobuf.Timestamp cert_expires_at = 5;
}

// ---- node -> coordinator ----

message NodeMessage {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    TokenChunk token_chunk = 3;
    DispatchAck dispatch_ack = 4;
    ChallengeResponse challenge_response = 5;
    ModelStateUpdate model_state = 6;
    Goodbye goodbye = 7;
    EmbeddingResult embedding_result = 8;
    DecisionResult decision_result = 9;
    BudgetUpdate budget_update = 10;
  }
}

message Hello {
  string node_id = 1;
  string daemon_version = 2;
  flock.types.v1.CapabilityProfile capability = 3;
  repeated flock.types.v1.ModelState models = 4;
  flock.types.v1.ResourceBudget budget = 5;
}

message Heartbeat {
  flock.types.v1.NodeState state = 1;
  uint32 queue_depth = 2;
  double tokens_per_sec_1m = 3; // rolling 1-minute mean
  double gpu_temp_celsius = 4;
  bool on_battery = 5;
  // Measured footprint of the loaded model runtimes (physical footprint /
  // proportional set size, not host-wide usage). On unified-memory
  // machines both fields carry the same number.
  uint64 vram_used_mb = 6;
  uint64 ram_used_mb = 7;
  repeated flock.types.v1.ModelState models = 8;
  google.protobuf.Timestamp at = 9;
}

// DispatchAck confirms receipt (or immediate rejection) of a dispatch so the
// coordinator can retry elsewhere fast instead of waiting for the deadline.
message DispatchAck {
  string request_id = 1;
  bool accepted = 2;
  string reject_reason = 3; // "yielded", "model-not-ready", "over-capacity"
}

message TokenChunk {
  string request_id = 1;
  string delta = 2;
  uint32 token_count = 3;
  bool done = 4;
  flock.types.v1.FinishReason finish_reason = 5;
  flock.types.v1.Usage usage = 6; // set when done
  string error = 7;              // set with FINISH_REASON_ERROR
  // Chain-of-thought delta for reasoning models, separate from delta so
  // the gateway can expose it as OpenAI's `reasoning_content`. Both are
  // relayed in full: the customer is billed for reasoning tokens and
  // canary comparison diffs the whole stream.
  string reasoning = 8;
}

message EmbeddingResult {
  string request_id = 1;
  // Flattened row-major [input_count x dims].
  repeated float embeddings = 2;
  uint32 dims = 3;
  flock.types.v1.Usage usage = 4;
  string error = 5;
}

// DecisionResult is the whole answer to a kind=DECISION dispatch: one
// message, no stream. usage.prompt_tokens is the runtime's input-token
// count across all questions; completion_tokens is always 0.
message DecisionResult {
  string request_id = 1;
  repeated flock.types.v1.DecisionAnswer answers = 2; // in question order
  flock.types.v1.Usage usage = 3;
  string error = 4;
  // True when the runtime rejected the input itself (too many options for
  // this model, prompt over the model's context): retrying on another node
  // cannot help, so the coordinator stops and the gateway answers 422.
  bool invalid_input = 5;
}

message ChallengeResponse {
  string challenge_id = 1;
  string output = 2;
  // SHA-256 of output; the coordinator compares against the private
  // expected-output set for (model_sha, quant, runtime_build_id).
  string output_sha256 = 3;
  uint32 completion_tokens = 4;
  double tokens_per_sec = 5;
  // Decision challenge (Challenge.decision set): the answers, compared
  // against the private expected probabilities within a tolerance. output
  // and output_sha256 are empty.
  repeated flock.types.v1.DecisionAnswer answers = 6;
}

message ModelStateUpdate {
  flock.types.v1.ModelState model = 1;
}

// BudgetUpdate replaces the ResourceBudget the session's Hello carried.
// The daemon sends it when the operator changes a budget setting live
// (max_disk_mb, max_ram_mb, the serve policy, the slot ceiling) so the
// coordinator's capacity view follows the app without a reconnect; the
// whole budget travels, never a delta. Coordinators that predate it drop
// the unknown oneof member and keep the Hello budget until the next
// session, which is what happened before (design note 2026-11-01).
message BudgetUpdate {
  flock.types.v1.ResourceBudget budget = 1;
}

// Goodbye is a graceful GOAWAY: the node is shutting down or yielding for an
// extended period; the coordinator reroutes immediately.
message Goodbye {
  string reason = 1;
  repeated string inflight_request_ids = 2; // being drained or cancelled
}

// ---- coordinator -> node ----

message CoordinatorMessage {
  oneof msg {
    HelloAck hello_ack = 1;
    DispatchRequest dispatch = 2;
    CancelRequest cancel = 3;
    Challenge challenge = 4;
    ModelAssignment model_assignment = 5;
    ConfigUpdate config = 6;
    Drain drain = 7;
    EarningsSnapshot earnings = 8;
  }
}

message HelloAck {
  string session_id = 1;
  uint32 heartbeat_interval_seconds = 2;
  string min_supported_version = 3;
}

// DispatchRequest carries no customer identity (SPEC §2.1): request_id is a
// per-request ephemeral ID. The signature covers the canonical serialization
// of every field except `signature` itself, using the coordinator key pinned
// at enrollment.
message DispatchRequest {
  string request_id = 1;
  string model_id = 2;
  string quant_sha256 = 3;
  flock.types.v1.RequestKind kind = 4;
  flock.types.v1.GenerationParams params = 5;
  repeated flock.types.v1.ChatMessage messages = 6; // kind=CHAT
  string prompt = 7;                               // kind=COMPLETION
  repeated string embedding_input = 8;             // kind=EMBEDDING
  google.protobuf.Timestamp deadline = 9;
  bytes signature = 10;
  flock.types.v1.DecisionInput decision = 11;      // kind=DECISION
}

message CancelRequest {
  string request_id = 1;
  string reason = 2;
}

// Challenge is a fingerprint probe (SPEC §2.2): fixed seed, greedy decode,
// known expected output per (model_sha, quant, runtime_build_id).
message Challenge {
  string challenge_id = 1;
  string model_id = 2;
  string prompt = 3;
  flock.types.v1.GenerationParams params = 4;
  // Set for a decision model instead of prompt/params: the probe is a fixed
  // state + questions and the response carries answers, not text.
  flock.types.v1.DecisionInput decision = 5;
}

// PlacementReason is why the coordinator asked a node for a model: which
// part of placement (SPEC §4.4) produced the entry. It travels with the
// ModelAssignment so the node can tell its operator "placed by the mesh
// floor" from "requested by a customer", and the node echoes it back as
// ModelState.reason while the placement is in flight (design note
// 2026-11-01).
enum PlacementReason {
  PLACEMENT_REASON_UNSPECIFIED = 0;
  // The floor pass: the catalog's default quant of each model line (or
  // the admin's floor list) keeps a baseline replica somewhere on the
  // fleet, so the catalog page is honest and a first request is never a
  // cold start.
  PLACEMENT_REASON_FLOOR = 1;
  // The demand pass: customers are requesting the model and its replica
  // target rose above what the fleet holds.
  PLACEMENT_REASON_DEMAND = 2;
  // Warm-on-request: a customer's request found no node holding the
  // model and placement ran for that one model right away.
  PLACEMENT_REASON_WARM = 3;
  // The floor pass staged it (ModelAssignment.stage): download only, held
  // cached so a later assign is a load rather than a download.
  PLACEMENT_REASON_STAGE = 4;
}

// Placement is the reason for one model in a ModelAssignment.
message Placement {
  string model_id = 1;
  PlacementReason reason = 2;
}

message ModelAssignment {
  // Download if needed, load, report ready.
  repeated flock.types.v1.ModelSpec assign = 1;
  repeated string evict_model_ids = 2;
  // Download if needed but do not load: report cached. Used by the floor
  // pass to stage models that fit on disk but not in memory right now, so
  // a later assign is a load, not a download.
  repeated flock.types.v1.ModelSpec stage = 3;
  // Why each model in assign and stage is being asked for, keyed by model
  // id (one entry per model; a model with no entry has no known reason).
  // A daemon that predates the field ignores it; the coordinator gates on
  // CapabilityProfile.daemon_version and sends it only to daemons that
  // can show it (flockd v0.9.0+), like ModelSpec.parts.
  repeated Placement placements = 4;
}

message ConfigUpdate {
  uint32 heartbeat_interval_seconds = 1;
  uint32 max_concurrent_requests = 2;
  // Daemon release channel, so a node learns it is outdated (or below the
  // minimum the coordinator still serves) from the mesh itself, without
  // reaching the public version feed. Empty = unknown.
  string latest_version = 3;
  string minimum_version = 4;
  string release_url = 5;
}

// Drain asks the node to finish in-flight work and stop accepting new
// dispatches (e.g. deprecated daemon version, maintenance).
message Drain {
  string reason = 1;
  google.protobuf.Timestamp deadline = 2;
}

// EarningsSnapshot is the operator's ledger position, pushed by the
// coordinator right after HelloAck, every push_interval_seconds, and shortly
// after each metered request this node served — so the daemon's earnings
// surfaces (`tera earnings`, the TUI, the desktop) show ledger-backed
// numbers instead of a local estimate. Every figure is for the OPERATOR
// ACCOUNT the node is enrolled under (all of that operator's nodes
// together), never this node alone: the ledger is per operator (SPEC §4.5).
// Amounts are integer ledger credits; credits_per_usd is the coordinator's
// peg, and the daemon does no conversion policy of its own. Daemons that
// predate this message ignore it (an unknown oneof member).
message EarningsSnapshot {
  // Settled: vested credits in the operator's main account, redeemable.
  int64 available_credits = 1;
  // Pending: credits in escrow, vesting after the canary window
  // (SPEC §4.5); slashable until then.
  int64 escrow_credits = 2;
  // The internal peg (1 credit = $0.000001 at launch).
  uint64 credits_per_usd = 3;
  // Payout credits earned (escrow + vested) since 00:00 UTC today.
  int64 earned_today_credits = 4;
  // Payout credits earned in the trailing seven days.
  int64 earned_7d_credits = 5;
  // Payout credits earned since the account was opened.
  int64 lifetime_payout_credits = 6;
  // When the coordinator read the ledger.
  google.protobuf.Timestamp as_of = 7;
  // When the oldest open escrow lot vests; unset with nothing in escrow.
  google.protobuf.Timestamp next_vest_at = 8;
  // The periodic cadence, so the daemon can tell a stale snapshot (older
  // than two intervals) from a fresh one and fall back to its estimate.
  uint32 push_interval_seconds = 9;
}
